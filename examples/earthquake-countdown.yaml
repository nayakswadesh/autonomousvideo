schema_version: 1
title: Earthquakes — a human-impact countdown
topic: The five most destructive earthquakes in recorded history, counting from 5 to 1
duration: 12
width: 540
height: 960
fps: 24
audience: Curious adults watching on a phone
editorial_objective: Explore destruction through reported fatalities, with uncertainty visible.
hook: When the ground changed history
hook_narration: Five disasters. Countless lives changed.
thesis: Human impact is different from earthquake magnitude.
payoff: Behind every number was a life.
audio_direction: Restrained documentary tone; no screams, collapse recordings, or sensational hits.
research:
  requirements:
    - Separate magnitude from human impact.
    - Include earthquake-triggered tsunami deaths where included in the cited estimate.
    - Treat disputed historical totals as estimates.
    - Verify global candidate completeness before calling these the definitive top five.
  ranking:
    metric: Reported fatalities, including missing where counted by the cited source
    methodology: Sort these five sourced candidate estimates descending, then present 5 to 1. Figures are source-specific estimates rather than comparable exact measurements.
    scope: Five selected historical earthquake disasters; an editorial research fixture.
    limitations: This is not an exhaustive all-history top five. Other historical events may qualify. Haiti is disputed; Tangshan and Haiyuan estimates differ between sources. The ordering requires editorial review before publication.
  sources:
    - id: usgs-facts
      title: USGS / Earthquake facts
      url: https://www.usgs.gov/programs/earthquake-hazards/earthquake-facts-earthquake-fantasy
      accessed: '2026-09-10'
      evidence_notes: USGS identifies the 1556 Shensi earthquake as the deadliest recorded and gives approximately 830,000 deaths.
    - id: usgs-tangshan
      title: USGS / Tangshan, six years later
      url: https://www.usgs.gov/publications/tangshan-six-years-later
      accessed: '2026-09-10'
      evidence_notes: This USGS account uses an official death toll of 240,000. Other USGS summaries use different estimates.
    - id: usgs-haiyuan
      title: USGS / Haiyuan impact record
      url: https://earthquake.usgs.gov/earthquakes/eventpage/iscgem912687/impact
      accessed: '2026-09-10'
      evidence_notes: The impact description reports 200,000 deaths for the December 1920 event.
    - id: eeri-haiti
      title: EERI / Haiti earthquake overview
      url: https://escweb.wr.usgs.gov/share/mooney/142.pdf
      accessed: '2026-09-10'
      evidence_notes: The 2011 paper reports a government total of 316,000 dead or missing and notes substantial disagreement among casualty estimates.
    - id: usgs-significant
      title: USGS / Significant earthquakes
      url: https://earthquake.usgs.gov/data/sign_eqs.pdf
      accessed: '2026-09-10'
      evidence_notes: The table lists 227,898 fatalities for the December 2004 northern Sumatra event; includes tsunami impacts.
  claims:
    - kind: numeric
      id: shaanxi-toll
      text: Around 830,000 deaths were reported for the 1556 Shaanxi earthquake.
      value: 830000
      unit: reported deaths
      source_ids: [usgs-facts]
      confidence: 0.75
      status: supported
      caveat: Historical estimate; not an exact modern census.
    - kind: numeric
      id: haiti-toll
      text: The Haitian government reported 316,000 dead or missing after the 2010 earthquake.
      value: 316000
      lower: 70000
      upper: 316000
      unit: reported dead or missing
      source_ids: [eeri-haiti]
      confidence: 0.4
      status: disputed
      caveat: Wide disagreement in casualty estimates makes rank sensitive to source selection.
    - kind: numeric
      id: tangshan-toll
      text: A USGS retrospective cites an official Tangshan death toll of 240,000.
      value: 240000
      unit: reported deaths
      source_ids: [usgs-tangshan]
      confidence: 0.65
      status: supported
      caveat: Other accounts give different totals; source-specific figure used here.
    - kind: numeric
      id: sumatra-toll
      text: The USGS significant-earthquakes table lists 227,898 fatalities for the 2004 Sumatra disaster.
      value: 227898
      unit: reported fatalities
      source_ids: [usgs-significant]
      confidence: 0.75
      status: supported
      caveat: Includes the regional tsunami, not just direct shaking deaths.
    - kind: numeric
      id: haiyuan-toll
      text: The USGS impact record reports approximately 200,000 deaths in the 1920 Haiyuan disaster.
      value: 200000
      unit: reported deaths
      source_ids: [usgs-haiyuan]
      confidence: 0.65
      status: supported
      caveat: Alternative historical estimates exist; use as an attributed estimate.
  subjects:
    - {id: haiyuan, title: Haiyuan, subtitle: 'China / 1920', claim_id: haiyuan-toll, rank: 5, narration: 'Haiyuan. China. Nineteen twenty.'}
    - {id: sumatra, title: Indian Ocean, subtitle: 'Earthquake and tsunami / 2004', claim_id: sumatra-toll, rank: 4, narration: 'The Indian Ocean tsunami.'}
    - {id: tangshan, title: Tangshan, subtitle: 'China / 1976', claim_id: tangshan-toll, rank: 3, narration: 'Tangshan. China. Nineteen seventy-six.'}
    - {id: haiti, title: Haiti, subtitle: 'Haiti / 2010', claim_id: haiti-toll, rank: 2, narration: 'Haiti. Two thousand ten.'}
    - {id: shaanxi, title: Shaanxi, subtitle: 'China / 1556', claim_id: shaanxi-toll, rank: 1, narration: 'Shaanxi. A devastating historical disaster.'}
